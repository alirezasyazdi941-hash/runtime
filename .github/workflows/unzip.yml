name: Unzip to repo root

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zips
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "no zip at repo root - nothing to do"; exit 0; fi
          for z in "${zips[@]}"; do
            echo "== $z"
            tmp="$RUNNER_TEMP/x"; rm -rf "$tmp"; mkdir -p "$tmp"
            unzip -q -o "$z" -d "$tmp"
            find "$tmp" -name '__MACOSX' -prune -exec rm -rf {} + ; find "$tmp" -name '.DS_Store' -delete
            rm -rf "$tmp/.github" "$tmp/.git"
            n=$(ls -A "$tmp" | wc -l)
            if [ "$n" -eq 1 ] && [ -d "$tmp/$(ls -A "$tmp")" ]; then src="$tmp/$(ls -A "$tmp")"; else src="$tmp"; fi
            rm -rf "$src/.github" "$src/.git"
            cp -a "$src"/. .
            rm -f "$z"
          done

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unzip uploaded archive" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
